services:
  api:
    build: .
    restart: unless-stopped
    environment:
      # Uses the shared host Postgres (container "postgres" on host port 2345).
      # host.docker.internal resolves to the host from inside the container.
      DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:2345/price_tracker?schema=public"
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

  # Local S3-compatible storage for dev (stands in for AWS S3).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the dev bucket then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/price-tracker-photos &&
      echo 'bucket ready'
      "

volumes:
  miniodata:
